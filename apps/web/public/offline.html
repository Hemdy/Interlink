<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Interlink Dashboard</title>
  <style>
    :root {
      --bg: #F9F9F8;
      --surface: #FFFFFF;
      --ink: #111827;
      --muted: #6B7280;
      --border: #E5E7EB;
      --forest: #285438;
      --forest-hover: #1E3F2A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1411;
        --surface: #18201B;
        --ink: #F3F4F6;
        --muted: #9CA3AF;
        --border: #2D3A31;
        --forest: #3E7954;
        --forest-hover: #4B9065;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2.5rem 2rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    .icon-wrapper {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: rgba(40, 84, 56, 0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      color: var(--forest);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--forest);
      color: #FFFFFF;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.65rem 1.4rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
      text-decoration: none;
      width: 100%;
    }
    .btn:hover {
      background-color: var(--forest-hover);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--forest);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <div class="badge">Interlink Workspace</div>
    <h1>No Internet Connection</h1>
    <p>The Interlink Dashboard requires an active network connection to securely sync your sessions, messages, and mentorship data.</p>
    <button class="btn" onclick="window.location.reload()">Check Connection & Retry</button>
  </div>
</body>
</html>
